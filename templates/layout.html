<!DOCTYPE html>
<html>
    <head>
      <!-- Font Awesome code -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css" integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w==" crossorigin="anonymous" referrerpolicy="no-referrer" />

      <!--Import the Bootstrap CSS file -->
      <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x"
      crossorigin="anonymous"
      />
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css"
      />

      
      <!-- CSS code -->
      <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='layout.css') }}">
      <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='home.css') }}">

      <!-- To activate media queries in devices -->
      <meta name="viewport" content="user-scalable=yes, width=device-width, initial-scale=1">

        {% if title %}
            <title>{{ title }}</title>
        {% else %}
            <title>home</title>
        {% endif %}
        
    </head>
    <body id="top">
        <section class="section_navbar">
          <div class="container">
            <div class="navbar">
              <h1 class="logo">
                <span class="text-logo">
                  <a class="logo_leaf_button" href="{{url_for('home')}}" aria-label="Go to home">
                    <i class="fa-solid fa-leaf"></i>
                  </a>
                  Carbon
                </span> App
              </h1>
              <nav>
                <ul>
                    <li>
                        <a href="{{url_for('home')}}"><i class="fa-solid fa-house"></i>Home</a>
                    </li>
                    <li>
                        <a href="{{url_for('methodology')}}"><i class="fa-solid fa-book-open"></i>Methology</a>
                    </li>
                    <li>
                        <a href="{{url_for('carbon_app')}}"><i class="fa-solid fa-leaf"></i>Carbon App</a>
                    </li>
                </ul>
              </nav>
              <div class="navbar_auth">
                <a href="#"><i class="fa-solid fa-user-plus"></i>Register</a>
                <a href="#"><i class="fa-solid fa-right-to-bracket"></i>Login</a>
              </div>
            </div>
          </div>
        </section>

        {% block content %} {% endblock %}

        <section class="section_footer">
          <div class="container">
            <div class="footer">
              <h1 class="footer_brand">Carbon App</h1>
              <a class="back_to_top" href="#top" aria-label="Back to top">
                <i class="fa-solid fa-chevron-up"></i>
              </a>
            </div>
          </div>
        </section>

    </body>
</html>
